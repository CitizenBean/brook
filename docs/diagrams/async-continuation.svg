<title>Brook asynchronous continuation</title>
<desc>An async tool declares whether a return is expected. Before dispatch, persist its context checkpoint, request, and output intent. A valid correlated return builds current context with retained logical call and outcome references. Stale or duplicate replies do not resume the continuation.</desc>
