<svg xmlns="http://www.w3.org/2000/svg" width="710" height="920" viewBox="0 0 710 920" role="img" aria-labelledby="title desc">
<title id="title">Brook event flow</title>
<desc id="desc">One shared execution model carries graph-node deliveries, optional agent work, correlated origin results and authorized sink effects. Logical routing can bypass agents.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#45657d"/></marker></defs>
<rect width="710" height="920" fill="#ffffff"/>
<g class="edge" data-source="ingress" data-target="processors" data-label=""><path d="M270.0 97 C270.0 127.5 270.0 127.5 270.0 158" fill="none" stroke="#45657d" stroke-width="2" marker-end="url(#arrow)"/>
</g>
<g class="edge" data-source="processors" data-target="agent" data-label="selected path"><path d="M270.0 232 C270.0 262.5 270.0 262.5 270.0 293" fill="none" stroke="#45657d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="216.5" y="239.5" width="107" height="21" fill="white"/><text x="270.0" y="253.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#294b62">selected path</text>
</g>
<g class="edge" data-source="processors" data-target="sink" data-label="direct sink path"><path d="M450 196 H630 V871 H452" fill="none" stroke="#45657d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="476.0" y="511.5" width="128" height="21" fill="white"/><text x="540" y="525.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#294b62">direct sink path</text>
</g>
<g class="edge" data-source="agent" data-target="work" data-label=""><path d="M270.0 367 C270.0 397.5 270.0 397.5 270.0 428" fill="none" stroke="#45657d" stroke-width="2" marker-end="url(#arrow)"/>
</g>
<g class="edge" data-source="work" data-target="reply" data-label=""><path d="M270.0 502 C270.0 532.5 270.0 532.5 270.0 563" fill="none" stroke="#45657d" stroke-width="2" marker-end="url(#arrow)"/>
</g>
<g class="edge" data-source="reply" data-target="resume" data-label="stored origin binding"><path d="M270.0 637 C270.0 667.5 270.0 667.5 270.0 698" fill="none" stroke="#45657d" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="188.5" y="644.5" width="163" height="21" fill="white"/><text x="270.0" y="658.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#294b62">stored origin binding</text>
</g>
<g class="edge" data-source="resume" data-target="sink" data-label=""><path d="M270.0 772 C270.0 802.5 270.0 802.5 270.0 833" fill="none" stroke="#45657d" stroke-width="2" marker-end="url(#arrow)"/>
</g>
<g class="node" data-id="ingress"><rect x="90" y="25" width="360" height="72" rx="10" fill="#edf4f8" stroke="#45657d" stroke-width="1.5"/>
<text x="270.0" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Ingress</text>
<text x="270.0" y="77" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Producer + durable admission</text>
</g>
<g class="node" data-id="processors"><rect x="90" y="160" width="360" height="72" rx="10" fill="#edf4f8" stroke="#45657d" stroke-width="1.5"/>
<text x="270.0" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Processors / routing Operator</text>
<text x="270.0" y="212" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Configured paths and transforms</text>
</g>
<g class="node" data-id="agent"><rect x="90" y="295" width="360" height="72" rx="10" fill="#edf4f8" stroke="#45657d" stroke-width="1.5"/>
<text x="270.0" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Agent node</text>
<text x="270.0" y="347" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">AgentConfig + swappable harness</text>
</g>
<g class="node" data-id="work"><rect x="90" y="430" width="360" height="72" rx="10" fill="#edf4f8" stroke="#45657d" stroke-width="1.5"/>
<text x="270.0" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Durable asynchronous work</text>
<text x="270.0" y="482" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Await-result correlation</text>
</g>
<g class="node" data-id="reply"><rect x="90" y="565" width="360" height="72" rx="10" fill="#edf4f8" stroke="#45657d" stroke-width="1.5"/>
<text x="270.0" y="595" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Authenticated reply</text>
<text x="270.0" y="617" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Accepted outcome + origin delivery</text>
</g>
<g class="node" data-id="resume"><rect x="90" y="700" width="360" height="72" rx="10" fill="#edf4f8" stroke="#45657d" stroke-width="1.5"/>
<text x="270.0" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Fresh origin invocation</text>
<text x="270.0" y="752" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Current context + exact evidence</text>
</g>
<g class="node" data-id="sink"><rect x="90" y="835" width="360" height="72" rx="10" fill="#edf4f8" stroke="#45657d" stroke-width="1.5"/>
<text x="270.0" y="865" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Authorized sink intent</text>
<text x="270.0" y="887" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#18354a">Applied / not applied / unknown</text>
</g>
</svg>
